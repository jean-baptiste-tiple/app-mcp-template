# CI
# Push sur main : build seulement. Type-check, lint et tests ont déjà tourné EN LOCAL
# (`pnpm verify`, reçu exigé par le gate de commit) ; la CI valide le déploiement Vercel
# et catche les erreurs spécifiques à l'environnement Linux.
# Pull request : les 4 checks du framework en plus du build. Une PR Dependabot ne passe
# jamais par le gate local, c'est ici son seul contrôle (deployment-patterns.md § Dependabot).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Checks (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Framework
        run: pnpm check:framework

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
