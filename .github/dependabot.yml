# Dependabot : mises à jour de dépendances (deployment-patterns.md § Dependabot).
#
# Politique du template :
# - Les MAJEURES sont ignorées partout. Une majeure est une décision (tech-stack.md, ADR si un
#   invariant bouge), jamais une PR hebdomadaire : zod 4, Next 16, vite 8 cassent des pins liés.
# - Les paquets épinglés en version exacte ou tilde dans package.json ont chacun une entrée
#   `ignore` sur les mineures ; les patchs restent proposés. `pnpm check:framework` refuse un
#   pin sans entrée ici : la raison du pin vit dans tech-stack.md, pas dans ce fichier.
# - Une PR groupée par semaine (mineures + patchs), après 7 jours de recul sur chaque version
#   (même esprit que `minimumReleaseAge` de pnpm). Les mises à jour de sécurité ne sont pas
#   soumises à ce délai.
# - La CI lance les 4 checks du framework sur toute pull request : c'est le seul gate d'une PR
#   Dependabot, qui ne passe jamais par `pnpm verify` en local.
version: 2
updates:
  - package-ecosystem: npm # pnpm passe par l'écosystème npm (lockfile v9, pnpm 12 supporté)
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
      default-days: 7
    groups:
      mineures-et-patchs:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pins exacts ou tilde de package.json (raison par ligne dans tech-stack.md).
      - dependency-name: "@modelcontextprotocol/sdk" # peer EXACT de mcp-handler 1.1.0 : bouge avec lui
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: mcp-handler
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@modelcontextprotocol/ext-apps"
        update-types: ["version-update:semver-minor"]
      - dependency-name: jose
        update-types: ["version-update:semver-minor"]
      - dependency-name: vite
        update-types: ["version-update:semver-minor"]
      - dependency-name: vite-plugin-singlefile
        update-types: ["version-update:semver-minor"]
      - dependency-name: typescript # 5.9+ : tsc --noEmit pend
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@testing-library/jest-dom" # 6.10.0 dépréciée par ses mainteneurs, la ligne 6.x s'arrête à 6.9.1
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
